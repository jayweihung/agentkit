# kit 內建：Node.js 的裝法。來源倉不能蓋過這個（來源倉的 tools/node.yaml 不算數）。
# install 每個系統列一種或幾種「套件管理器 套件名」，kit 依序試這台能用的，一種失敗就換下一種。
# 能用的管理器只有：brew、apt（要是 root）、winget、scoop、pip。實際指令由 kit 組，這裡不能寫指令。
# 套件名只能是單純的名字（英文字母或數字開頭，不能有 /）；scoop 可以加 main/、extras/、versions/。
name: node
title: Node.js
bin: [node]
install:
  mac: [brew node]
  windows: [winget OpenJS.NodeJS.LTS, scoop nodejs-lts]
  linux: [apt nodejs, brew node]
